# ===== KB0110 設定 =====

# 注意: キースキャンはポーリング動作 (割り込み用ピンが基板に無い) のため、
# deep sleep からキー押下で復帰できません。CONFIG_ZMK_SLEEP は有効にしないでください。
# CONFIG_ZMK_SLEEP=y
# 消費電流を抑えたい場合は kb0110.dtsi の poll-period-ms を大きくします (キー反応は遅くなります)

# SK6812MINI x3 (underglow)
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_SPI=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=30
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y

# BLE 出力を強めに (Plus 内蔵アンテナ用; 不要なら削除)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ZMK Studio を使う場合は有効化 (central 側のみ)
# CONFIG_ZMK_STUDIO=y
